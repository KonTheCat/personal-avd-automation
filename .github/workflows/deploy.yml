name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - "avdprovisioning/**"
      - "function_app.py"
      - "host.json"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: ktk-avd-per-user-automation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sanity-check the package compiles
        run: python -m py_compile function_app.py avdprovisioning/*.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure/functions-action@v1 does a plain zip push that skips the remote
      # (Oryx) build on this app's Flex Consumption plan, silently leaving
      # requirements.txt uninstalled server-side (host then fails with
      # ModuleNotFoundError). func core tools' `azure functionapp publish`
      # is the one deployment path confirmed to trigger a real remote build
      # here — it reuses the az CLI session azure/login just established.
      - name: Deploy to Azure Functions
        run: func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME }} --python
